<!doctype html>
<html lang="en">
    <head>
        <title>Sun Position Calculator</title>
    </head>
    <body>
        <h1>Sun Position Calculator</h1>
        <label for="latitude">Latitude:</label>
        <input type="number" id="latitude" step="0.0001" value="0" /><br />
        <label for="longitude">Longitude:</label>
        <input type="number" id="longitude" step="0.0001" value="0" /><br />
        <label for="month">Month:</label>
        <input type="number" id="month" min="1" max="12" value="1" /><br />
        <label for="day">Day:</label>
        <input type="number" id="day" min="1" max="31" value="1" /><br />
        <label for="hour">Hour:</label>
        <input type="number" id="hour" min="0" max="23" value="12" /><br />
        <label for="minute">Minute:</label>
        <input type="number" id="minute" min="0" max="59" value="0" /><br />
        <button id="calculate">Calculate</button>
        <div id="result">
            Altitude: <span id="altitude"></span><br />
            Azimuth: <span id="azimuth"></span>
        </div>
        <script src="main.js"></script>
    </body>
</html>
